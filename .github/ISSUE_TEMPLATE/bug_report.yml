name: Bug report
description: Something broken in npp-x
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **Security issues** → use [SECURITY.md](../SECURITY.md), not this form.
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Browser (Vite preview / static host)
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant console or build output (redact secrets).
