# Build and publish npp-x installers for major desktop targets.
# Triggers: tag v*  OR  Actions → Release → Run workflow
#
# macOS signing: tauri.conf.json uses signingIdentity "-" (ad-hoc).
# Do NOT pass empty APPLE_CERTIFICATE* env vars — Tauri treats them as
# “use PKCS#12” and the Mac jobs fail with SecKeychainItemImport errors.
# When you have a real Apple Developer cert, set the secrets and add those
# env vars back to the build step (non-empty values only).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1). Leave empty to use package version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS Apple Silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS Intel
          - platform: ubuntu-22.04
            args: ""
            name: Linux x64
          - platform: windows-latest
            args: ""
            name: Windows x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build & upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || 'v__VERSION__' }}
          releaseName: "npp-x v__VERSION__"
          releaseBody: |
            Cross-platform Notepad++-inspired editor (Tauri 2 + React + Monaco).

            ### macOS Gatekeeper
            Free CI builds are **ad-hoc signed** (not Apple-notarized). If macOS says it cannot verify the app:

            1. **Right-click** `npp-x.app` → **Open** → **Open**, or
            2. Run: `xattr -cr /Applications/npp-x.app && open /Applications/npp-x.app`

            Full guide: [docs/MACOS-OPEN.md](https://github.com/arun-prasad-t/npp-x/blob/main/docs/MACOS-OPEN.md)

            ### Downloads
            | Platform | Typical asset |
            |----------|----------------|
            | macOS Apple Silicon | `.dmg` / `.app` (`aarch64`) |
            | macOS Intel | `.dmg` / `.app` (`x64`) |
            | Windows x64 | `.msi` / `.exe` |
            | Linux x64 | `.AppImage` / `.deb` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
