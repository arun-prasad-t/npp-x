[package]
name = "npp-x"
version = "0.1.10"
description = "Cross-platform Notepad++-inspired editor (Tauri + Rust)"
authors = ["npp-x"]
edition = "2021"

[lib]
name = "npp_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"

# macOS: WKWebView JS print() is a no-op — native print-to-PDF instead.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDate", "NSRunLoop", "NSDictionary", "NSGeometry", "NSObject", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSPrintInfo", "NSPrintOperation", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKNavigation"] }
objc2-core-foundation = "0.3"
